# Build + publish the relay image to GHCR on a version tag *you* push:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Then on the NAS: `docker compose pull && docker compose up -d`.
# Not triggered by pushes to main — only by tags.
name: deploy-relay

on:
  push:
    tags:
      - 'v*' # e.g. v0.1.0
      - '[0-9]*' # e.g. 0.1.0 (bare semver)

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr.io/<owner>/* — no PAT needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Gate the publish on the backend tests/typecheck (mirrors the Dockerfile's
      # esbuild build-script workaround).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install + test (backend)
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high
          pnpm rebuild esbuild
          pnpm typecheck
          pnpm test

      # Multi-arch so the image runs on amd64 (most NAS/Proxmox) or arm64.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/hearth-relay
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
