# Full CI on every PR and push to main, so Dependabot (and any PR) shows pass/fail
# before merge: analyse + tests for all three packages, plus a release build for
# every platform — the build jobs catch dependency bumps that break compilation,
# not just the tests (e.g. the desugaring / url_launcher class of breakage).
name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# Newer pushes to the same ref cancel older in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace deps
        working-directory: app
        run: flutter pub get
      - name: Analyze + test (core)
        working-directory: core
        run: |
          dart analyze --fatal-infos
          dart test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Analyze + test (app)
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate relay Compose files
        env:
          TS_AUTHKEY: ci-compose-validation
        run: |
          docker compose -f backend/docker-compose.yml config --quiet
          docker compose -f backend/docker-compose.tailscale.yml config --quiet
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Typecheck + test (backend)
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high
          pnpm typecheck
          pnpm test

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up disposable CI keystore
        working-directory: app/android
        run: |
          keytool -genkeypair -noprompt \
            -keystore app/ci-release.jks \
            -storepass ci-release-only \
            -keypass ci-release-only \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Hearth CI"
          cat > key.properties <<'EOF'
          storePassword=ci-release-only
          keyPassword=ci-release-only
          keyAlias=ci-release
          storeFile=ci-release.jks
          EOF
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --dart-define=APP_VERSION=ci

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Windows
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release --dart-define=APP_VERSION=ci
      - name: Build Windows installer
        shell: pwsh
        run: .github/scripts/build-windows-installer.ps1 -Version '0.0.0' -BuildDir 'app/build/windows/x64/runner/Release' -OutputDir "$env:RUNNER_TEMP"

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --dart-define=APP_VERSION=ci
