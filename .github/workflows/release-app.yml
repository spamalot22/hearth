# Build the Hearth client and attach it to a GitHub Release on a version tag.
# One tag drives the complete coordinated release: full verification, client
# builds, relay image publication to GHCR, then the immutable GitHub Release.
#
#   git tag 0.1.1 && git push origin 0.1.1
#
# Android releases use the stable CI keystore. Linux/macOS/iOS are skipped for now.
name: release-app

on:
  push:
    tags:
      - 'v*' # v0.1.1
      - '[0-9]*' # 0.1.1

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  # Derive the version from the tag — the single source of truth for a release.
  # versionName is the semver (any leading "v" stripped); versionCode is a
  # monotonic integer (major*1e6 + minor*1e3 + patch) so Android accepts each
  # release as an in-place upgrade. No more hand-editing pubspec per release.
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.compute.outputs.name }}
      code: ${{ steps.compute.outputs.code }}
    steps:
      - id: compute
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
        run: |
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must be X.Y.Z or vX.Y.Z."
            exit 1
          fi
          if ! [[ "$RELEASE_PUBLIC_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::RELEASE_PUBLIC_KEY must be configured as 64 hex characters."
            exit 1
          fi
          NAME="${TAG#v}"                 # strip an optional leading "v"
          IFS=. read -r MAJ MIN PAT <<< "$NAME"
          # 10# forces base-10 so a zero-padded part can't be read as octal.
          CODE=$(( 10#${MAJ:-0} * 1000000 + 10#${MIN:-0} * 1000 + 10#${PAT:-0} ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag $TAG -> versionName $NAME, versionCode $CODE"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Verify core and app
        working-directory: app
        run: |
          flutter pub get
          cd ../core && dart analyze --fatal-infos && dart test
          cd ../app && flutter analyze && flutter test
      - name: Verify backend and deployment config
        env:
          TS_AUTHKEY: ci-compose-validation
        run: |
          docker compose -f backend/docker-compose.yml config --quiet
          docker compose -f backend/docker-compose.tailscale.yml config --quiet
          cd backend
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high
          pnpm typecheck
          pnpm test

  relay:
    needs: [version, verify, android, windows, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/hearth-relay
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  android:
    needs: [version, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up release keystore
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Android release signing secrets are not fully configured."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/hearth-release.jks
          cat > key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=hearth-release.jks
          EOF
          echo "Release keystore configured."
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.code }} --dart-define=APP_VERSION=${{ github.ref_name }} --dart-define=RELEASE_PUBLIC_KEY=${{ vars.RELEASE_PUBLIC_KEY }} --dart-define=RELAY_URL=${{ vars.RELAY_URL }}
      - run: mv app/build/app/outputs/flutter-apk/app-release.apk hearth-android.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android
          path: hearth-android.apk

  windows:
    needs: [version, verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Windows
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.code }} --dart-define=APP_VERSION=${{ github.ref_name }} --dart-define=RELEASE_PUBLIC_KEY=${{ vars.RELEASE_PUBLIC_KEY }} --dart-define=RELAY_URL=${{ vars.RELAY_URL }}
      - name: Build installer
        shell: pwsh
        run: .github/scripts/build-windows-installer.ps1 -Version '${{ needs.version.outputs.name }}' -BuildDir 'app/build/windows/x64/runner/Release' -OutputDir "$env:GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows
          path: hearth-windows-setup.exe

  web:
    needs: [version, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --dart-define=APP_VERSION=${{ github.ref_name }} --dart-define=RELEASE_PUBLIC_KEY=${{ vars.RELEASE_PUBLIC_KEY }} --dart-define=RELAY_URL=${{ vars.RELAY_URL }}
      - name: Zip
        run: cd app/build/web && zip -r "$GITHUB_WORKSPACE/hearth-web.zip" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web
          path: hearth-web.zip

  # GitHub releases are immutable once published, so all platform builds and the
  # signed manifest must exist before this job creates and publishes the draft.
  release:
    needs: [android, windows, web, relay, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and publish the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Guard against a pre-published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # releases/tags only resolves *published* releases; drafts 404 here.
          if gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq .id >/dev/null 2>&1; then
            echo "::error::A published release already exists for ${{ github.ref_name }} — it is immutable, so CI cannot attach assets. Release by pushing a tag (git tag X.Y.Z && git push origin X.Y.Z), not via the GitHub UI publish button, and cut a new patch tag now."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend deps
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high
      - name: Sign manifest
        working-directory: backend
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
        run: |
          if ! [[ "$RELEASE_PRIVATE_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::RELEASE_PRIVATE_KEY must be configured as 64 hex characters."
            exit 1
          fi
          SEQ=$(date +%s)
          pnpm exec tsx src/sign-release.ts manifest "${{ github.ref_name }}" "$SEQ" "$RELEASE_PRIVATE_KEY" \
            android=../dist/hearth-android.apk windows=../dist/hearth-windows-setup.exe > ../dist/manifest.json
      - run: ls -lR dist
      - name: Create draft release with assets
        id: gh_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
      - name: Publish release
        # Only a complete release gets published (immutably). Otherwise the
        # draft stays for a re-run to finish or a human to judge.
        if: |
          needs.android.result == 'success' &&
          needs.windows.result == 'success' &&
          needs.web.result == 'success' &&
          needs.relay.result == 'success' &&
          needs.verify.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..5}; do
            if url=$(gh api -X PATCH "repos/${{ github.repository }}/releases/${{ steps.gh_release.outputs.id }}" \
              -F draft=false --jq .html_url); then
              echo "$url"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::GitHub did not publish the release after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 15))
            echo "GitHub publish attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done
